<!DOCTYPE html>
<html>
<head>
    <title>Debug Chart Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
</head>
<body>
    <h1>Debug Chart Test</h1>
    <div style="width: 600px; height: 400px;">
        <canvas id="debugChart"></canvas>
    </div>
    
    <div id="debug-info">
        <h3>Debug Information:</h3>
        <div id="debug-output"></div>
    </div>

    <script>
        // Test data (ข้อมูลทดสอบที่เรารู้ว่าทำงาน)
        const testData = [
            { timestamp: '15:30:00', temperature: 25.5, humidity: 60.0 },
            { timestamp: '15:31:00', temperature: 26.0, humidity: 58.5 },
            { timestamp: '15:32:00', temperature: 25.8, humidity: 61.2 },
            { timestamp: '15:33:00', temperature: 27.2, humidity: 59.8 },
            { timestamp: '15:34:00', temperature: 26.5, humidity: 62.1 }
        ];
        
        console.log('📊 Test data:', testData);
        
        // Debug output
        const debugOutput = document.getElementById('debug-output');
        debugOutput.innerHTML = `
            <p><strong>Chart.js loaded:</strong> ${typeof Chart !== 'undefined' ? 'Yes ✅' : 'No ❌'}</p>
            <p><strong>Test data points:</strong> ${testData.length}</p>
            <p><strong>Sample data:</strong> ${JSON.stringify(testData[0], null, 2)}</p>
        `;
        
        // Create chart
        if (typeof Chart !== 'undefined') {
            const ctx = document.getElementById('debugChart').getContext('2d');
            
            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: testData.map(item => item.timestamp),
                    datasets: [{
                        label: 'Temperature (°C)',
                        data: testData.map(item => item.temperature),
                        borderColor: 'rgb(255, 99, 132)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        tension: 0.1
                    }, {
                        label: 'Humidity (%)',
                        data: testData.map(item => item.humidity),
                        borderColor: 'rgb(54, 162, 235)',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: false
                        }
                    }
                }
            });
            
            console.log('✅ Debug chart created successfully');
            debugOutput.innerHTML += '<p><strong>Chart creation:</strong> Success ✅</p>';
        } else {
            console.error('❌ Chart.js not loaded');
            debugOutput.innerHTML += '<p><strong>Chart creation:</strong> Failed - Chart.js not loaded ❌</p>';
        }
    </script>
</body>
</html>
